global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    # main.ts: setGlobalPrefix('api') + URI versioning (defaultVersion '1') apply to
    # the PrometheusController too, so the real route is /api/v1/metrics, not /metrics.
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']
