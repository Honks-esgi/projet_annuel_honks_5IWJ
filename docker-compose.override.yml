services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /app/apps/api
    command: npm run start:dev
    tty: true
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/test:/app/apps/api/test
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-honks}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      DB_NAME: ${POSTGRES_DB:-honks}
      DATABASE_URL: postgresql://${POSTGRES_USER:-honks}:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB:-honks}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - honks-nest-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app/apps/web
    command: npm run dev
    volumes:
      - .:/app
      - web_modules:/app/apps/web/node_modules
    environment:
      NODE_ENV: development
    networks:
      - honks-nest-api

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: dev
    working_dir: /app/apps/mobile
    command: npx expo start
    volumes:
      - .:/app
      - mobile_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DOCKER: "1"
    networks:
      - honks-nest-api

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-honks}
    ports:
      # loopback only
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - honks-nest-api

  adminer:
    ports:
      - "8080:8080"
    networks:
      - honks-nest-api


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - honks-nest-api

  # dev email catcher
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - honks-nest-api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - api
    networks:
      - honks-nest-api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    env_file: .env
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    networks:
      - honks-nest-api

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    env_file: .env
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml
    command: -config.file=/etc/tempo/tempo.yaml
    depends_on:
      - api
    networks:
      - honks-nest-api

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    env_file: .env
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      - api
    networks:
      - honks-nest-api

networks:
  honks-nest-api:
    driver: bridge

volumes:
  web_modules:
  mobile_modules:
  postgres_data:
  redis_data:
