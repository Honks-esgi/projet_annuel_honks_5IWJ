# Ce fichier ne définit volontairement AUCUN objet Kubernetes.
#
# Les Secrets ne doivent jamais être committés en clair (même en base64,
# ce n'est pas du chiffrement) — donc pas de "kubectl apply -f" ici.
# Exécute ces commandes une fois par cluster, avant de déployer.

# ── honks-secrets (namespace honks-app) — lu par l'API ──────────────────────
# kubectl create secret generic honks-secrets -n honks-app \
#   --from-literal=DB_PASSWORD=<mot-de-passe-fort>

# ── honks-db-credentials (namespace honks-db) — lu par CloudNativePG ────────
# kubectl create secret generic honks-db-credentials -n honks-db \
#   --from-literal=username=honks \
#   --from-literal=password=<même-mot-de-passe-que-DB_PASSWORD>

# ── honks-tls (namespaces honks-app ET honks-monitoring) — lu par Traefik ───
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt \
#   -subj "/CN=honks.local/O=Honks/C=FR" \
#   -addext "subjectAltName=DNS:honks.local"
#
# kubectl create secret tls honks-tls -n honks-app --cert=tls.crt --key=tls.key
# kubectl create secret tls honks-tls -n honks-monitoring --cert=tls.crt --key=tls.key
#
# rm tls.key tls.crt
