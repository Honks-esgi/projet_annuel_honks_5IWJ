apiVersion: apps/v1
kind: Deployment
metadata:
  name: honks-api
  namespace: honks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: honks-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: honks-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: jsankare/honks-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: honks-config
            - secretRef:
                name: honks-secrets
