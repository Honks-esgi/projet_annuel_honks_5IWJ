apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honks-ingress
  namespace: honks-app
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [honks.local]
      secretName: honks-tls
  rules:
    - host: honks.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: honks-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: honks-web
                port:
                  number: 3001
