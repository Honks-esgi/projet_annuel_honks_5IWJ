services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /app/apps/api
    command: npm run start:dev
    volumes:
      - .:/app
      - api_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app/apps/web
    command: npm run dev
    volumes:
      - .:/app
      - web_modules:/app/node_modules
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
    depends_on:
      - api

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: dev
    working_dir: /app/apps/mobile
    command: npx expo start
    volumes:
      - .:/app
      - mobile_modules:/app/node_modules
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      NODE_ENV: development
      DOCKER: "1"
    depends_on:
      - api

volumes:
  api_modules:
  web_modules:
  mobile_modules:
