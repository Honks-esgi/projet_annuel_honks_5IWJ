services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /app/apps/api
    command: npm run start:dev
    volumes:
      - .:/app
      - api_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app/apps/web
    command: npm run dev
    volumes:
      - .:/app
      - web_modules:/app/apps/web/node_modules
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
    depends_on:
      - api

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: dev
    working_dir: /app/apps/mobile
    command: npx expo start
    volumes:
      - .:/app
      - mobile_modules:/app/node_modules
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      NODE_ENV: development
      DOCKER: "1"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    env_file: .env
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    env_file: .env
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml
    command: -config.file=/etc/tempo/tempo.yaml
    depends_on:
      - api

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    env_file: .env
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      - api

volumes:
  api_modules:
  web_modules:
  mobile_modules:
