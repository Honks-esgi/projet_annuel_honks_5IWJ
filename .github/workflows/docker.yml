name: Docker Build & Push

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (api | web | mobile | all)'
        required: false
        default: 'all'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Détecte quelles apps ont changé pour éviter des builds inutiles
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'shared/**'
              - 'package*.json'
              - 'VERSION'
            web:
              - 'apps/web/**'
              - 'shared/**'
              - 'package*.json'
              - 'VERSION'
            mobile:
              - 'apps/mobile/**'
              - 'shared/**'
              - 'package*.json'
              - 'VERSION'

  build:
    name: Build & push ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    needs: detect

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            image: jsankare/honks-api
            dockerfile: apps/api/Dockerfile
          - name: web
            image: jsankare/honks-web
            dockerfile: apps/web/Dockerfile
          - name: mobile
            image: jsankare/honks-app
            dockerfile: apps/mobile/Dockerfile

    steps:
      # Se lance si ce job doit builder selon les changements détectés ou le workflow_dispatch
      - name: Resolve build flag
        id: check
        run: |
          APP="${{ matrix.app.name }}"
          DISPATCH_APP="${{ github.event.inputs.app }}"

          # En workflow_dispatch, on respecte le choix manuel
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_APP" = "all" ] || [ "$DISPATCH_APP" = "$APP" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Sur un tag git, on rebuild tout
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Sinon, on se base sur les fichiers changés
          if [ "$APP" = "api" ];    then echo "should_build=${{ needs.detect.outputs.api }}"    >> $GITHUB_OUTPUT; fi
          if [ "$APP" = "web" ];    then echo "should_build=${{ needs.detect.outputs.web }}"    >> $GITHUB_OUTPUT; fi
          if [ "$APP" = "mobile" ]; then echo "should_build=${{ needs.detect.outputs.mobile }}" >> $GITHUB_OUTPUT; fi

      - name: Checkout
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        if: steps.check.outputs.should_build == 'true'
        id: version
        run: echo "value=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Generate tags & labels
        if: steps.check.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.app.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/preprod' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build & push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  trivy:
    name: Trivy scan — ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            image: jsankare/honks-api:latest
          - name: web
            image: jsankare/honks-web:latest
          - name: mobile
            image: jsankare/honks-app:latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
        with:
          image-ref: ${{ matrix.app.image }}
          format: sarif
          output: trivy-${{ matrix.app.name }}.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          vex: .vex/vex.json

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        with:
          sarif_file: trivy-${{ matrix.app.name }}.sarif
          category: trivy-${{ matrix.app.name }}

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: trivy-report-${{ matrix.app.name }}
          path: trivy-${{ matrix.app.name }}.sarif
          retention-days: 14
